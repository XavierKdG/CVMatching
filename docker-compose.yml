version: '3.8'

services:
  # Service 1: Your Streamlit App
  app:
    build: .  # Build the image from the Dockerfile in this directory
    ports:
      - "8501:8501" # Expose Streamlit to your host machine
    volumes:
      # Mount your local code into the container
      # This allows for LIVE-RELOADING.
      # When you save app.py, the container sees it instantly.
      - ./:/app
    depends_on:
      - qdrant  # Wait for qdrant to be "up" before starting
    # This ensures your app can find the 'src' module
    working_dir: /app
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

  # Service 2: Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333" # gRPC port
      - "6334:6334" # Web UI / REST port
    volumes:
      - qdrant_storage:/qdrant/storage # Persist data

  # Service 3: Doccano Annotation Tool
  doccano:
    image: doccano/doccano:latest
    ports:
      - "8000:8000"
    environment:
      # Set up a default admin user for Doccano
      - ADMIN_USERNAME=admin
      - ADMIN_EMAIL=admin@example.com
      - ADMIN_PASSWORD=password
    volumes:
      - doccano_data:/data # Persist Doccano's database

# Define the named volumes to persist data
volumes:
  qdrant_storage:
  doccano_data:
