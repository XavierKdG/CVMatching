pipeline:
  mode: 'base' # 'base' or 'custom' 

logging:
  file_name: "pipeline.log" # custom log file name

paths:
  raw_folder: "data/raw"
  processed_folder: "data/processed"
  models_folder: "models"
  spacy_config: "configs/spacy_config.cfg"

models:
  base_model: "en_core_web_lg" # "en_core_web_sm", "en_core_web_md", "en_core_web_lg" (different sizes)
  similarity_model: "all-MiniLM-L6-v2" # "all-MiniLM-L6-v2", "all-mpnet-base-v2", etc.

datasets:
  jobs:
    input_filename: 'job_descriptions2.csv'
    id_column: 'Job ID'
    duplicate_subset: ['Job ID'] 
    columns_to_process: 
      - 'Job Description'
      - 'Preferred Skills'
      - 'Work Location 1'
      - 'Minimum Qual Requirements'
      - 'Business Title'
      - 'Job Category'
    qdrant_collection_name: "job_collection"
    qdrant_payload_columns: ["Job ID", "Business Title", "Job Category", "cleaned_text", "Work Location 1", "Hours/Shift"]

  resumes:
    input_filename: 'Resume.csv'
    id_column: 'ID'
    duplicate_subset: null
    columns_to_process: ['Resume_str', 'Category']
    qdrant_collection_name: "resume_collection"
    qdrant_payload_columns: ["ID", "Category", "cleaned_text"]

preprocessing:
  train_data_file: "training_data.jsonl" # File to store NER training data
  ner_label_key: "label" # Key in training data for NER labels
  chunksize: 50000
  trainsize: 0.8 # train/dev split

training:
  seed: 42
  optimizer: "accuracy" # "accuracy" or "efficiency"

qdrant:
  url: "http://qdrant:6333"
  timeout: 60
  batch_size: 1028 # Number of vectors to send in each batch

evaluation:
  weights:
    semantic: 0.6 # Weight for semantic similarity
    keyword: 0.4 # Weight for keyword matching
  
  standalone_regex_skills: # Skills to match as whole words only
    - 'r'
    - 'ai'
    - 'go'
    - 'pos'
    - 'sem'
    - 'git'

  hard_skill_keywords: # List of hard skill keywords to look for
